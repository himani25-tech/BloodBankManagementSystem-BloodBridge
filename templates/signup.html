<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BloodBridge – Register</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #090c14; --surface: #0f1320; --surface2: #151b2e;
    --border: rgba(255,255,255,0.08); --red: #e63946;
    --red-dim: rgba(230,57,70,0.15); --text: #e8eaf2; --muted: #6b7280;
  }
  body {
    font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; padding: 20px;
  }
  .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.1; animation: float 8s ease-in-out infinite; }
  .orb1 { width: 500px; height: 500px; background: var(--red); top: -150px; right: -100px; }
  .orb2 { width: 350px; height: 350px; background: #2563eb; bottom: -80px; left: -80px; animation-delay: 4s; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

  .card {
    position: relative; z-index: 1;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px; width: 100%; max-width: 560px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .card-header { text-align: center; margin-bottom: 32px; }
  .card-icon {
    width: 60px; height: 60px; background: linear-gradient(135deg, #e63946, #b91c1c);
    border-radius: 16px; display: grid; place-items: center; font-size: 28px;
    margin: 0 auto 16px; box-shadow: 0 0 30px rgba(230,57,70,0.35);
  }
  .card-title { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; }
  .card-sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .card-sub a { color: var(--red); text-decoration: none; font-weight: 600; }

  /* Role selector */
  .role-tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--surface2); border-radius: 12px; padding: 5px; }
  .role-tab {
    flex: 1; padding: 10px; text-align: center; border-radius: 9px; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--muted); transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .role-tab.active { background: var(--red); color: #fff; box-shadow: 0 2px 12px rgba(230,57,70,0.35); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 7px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .form-input, .form-select {
    padding: 11px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13.5px;
    transition: border-color 0.2s; outline: none; width: 100%;
  }
  .form-input:focus, .form-select:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(230,57,70,0.1); }
  .form-input::placeholder { color: var(--muted); }
  .form-select { cursor: pointer; -webkit-appearance: none; }
  option { background: var(--surface2); }

  /* Donor-only fields */
  .donor-fields { display: contents; }
  .donor-fields.hidden { display: none; }
  .hospital-fields { display: contents; }
  .hospital-fields.hidden { display: none; }

  .error-msg { background: rgba(230,57,70,0.1); border: 1px solid rgba(230,57,70,0.3); color: #ff6b6b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
  .error-msg.show { display: block; }
  .success-msg { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #10b981; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
  .success-msg.show { display: block; }

  .btn-register {
    width: 100%; padding: 13px; background: var(--red); color: #fff;
    border: none; border-radius: 10px; font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 20px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-register:hover { background: #c62835; box-shadow: 0 4px 20px rgba(230,57,70,0.4); transform: translateY(-1px); }
  .btn-register.loading { opacity: 0.7; pointer-events: none; }

  @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: 1; } }
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="card">
  <div class="card-header">
    <div class="card-icon">🩸</div>
    <div class="card-title">Create Account</div>
    <div class="card-sub">Already have an account? <a href="/login">Sign in</a></div>
  </div>

  <div class="role-tabs">
    <div class="role-tab active" onclick="setRole('donor', this)">🩸 Donor</div>
    <div class="role-tab" onclick="setRole('hospital', this)">🏥 Hospital</div>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <div class="form-grid" id="formGrid">
    <div class="form-group">
      <label class="form-label">Full Name *</label>
      <input class="form-input" type="text" id="name" placeholder="Your full name">
    </div>
    <div class="form-group">
      <label class="form-label">Email *</label>
      <input class="form-input" type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label class="form-label">Phone</label>
      <input class="form-input" type="tel" id="phone" placeholder="+91 XXXXX XXXXX">
    </div>
    <div class="form-group">
      <label class="form-label">City</label>
      <input class="form-input" type="text" id="city" placeholder="e.g. Bhopal">
    </div>

    <!-- Donor-only -->
    <div class="form-group donor-fields" id="bloodGroupField">
      <label class="form-label">Blood Group *</label>
      <select class="form-select" id="blood_group">
        <option value="A+">A+</option><option value="A-">A-</option>
        <option value="B+">B+</option><option value="B-">B-</option>
        <option value="AB+">AB+</option><option value="AB-">AB-</option>
        <option value="O+" selected>O+</option><option value="O-">O-</option>
      </select>
    </div>
    <div class="form-group donor-fields" id="dobField">
      <label class="form-label">Date of Birth</label>
      <input class="form-input" type="date" id="dob">
    </div>
    <div class="form-group donor-fields" id="genderField">
      <label class="form-label">Gender</label>
      <select class="form-select" id="gender">
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group donor-fields" id="weightField">
      <label class="form-label">Weight (kg)</label>
      <input class="form-input" type="number" id="weight" placeholder="e.g. 65">
    </div>
    <div class="form-group full donor-fields" id="addressField">
      <label class="form-label">Address</label>
      <input class="form-input" type="text" id="address" placeholder="Full residential address">
    </div>
    <div class="form-group donor-fields" id="ecNameField">
      <label class="form-label">Emergency Contact Name</label>
      <input class="form-input" type="text" id="ec_name" placeholder="Contact's full name">
    </div>
    <div class="form-group donor-fields" id="ecPhoneField">
      <label class="form-label">Emergency Contact Phone</label>
      <input class="form-input" type="tel" id="ec_phone" placeholder="+91 XXXXX XXXXX">
    </div>

    <!-- Hospital-only -->
    <div class="form-group hospital-fields hidden" id="hospitalTypeField">
      <label class="form-label">Hospital Type</label>
      <select class="form-select" id="hospital_type">
        <option>Government</option><option>Private</option><option>Trust</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Password *</label>
      <input class="form-input" type="password" id="password" placeholder="Min 6 characters">
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password *</label>
      <input class="form-input" type="password" id="confirm_password" placeholder="Repeat password">
    </div>
  </div>

  <button class="btn-register" id="regBtn" onclick="doRegister()">
    <span>✅</span> Create Account
  </button>
</div>

<script>
let currentRole = 'donor';

function setRole(role, el) {
  currentRole = role;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('bloodGroupField').classList.toggle('hidden', role !== 'donor');
  document.querySelectorAll('.hospital-fields').forEach(f => f.classList.toggle('hidden', role !== 'hospital'));
}

async function doRegister() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  const err = document.getElementById('errorMsg');
  const suc = document.getElementById('successMsg');
  err.classList.remove('show'); suc.classList.remove('show');

  if (!name || !email || !password) { showErr('Please fill required fields'); return; }
  if (password !== confirm) { showErr('Passwords do not match'); return; }
  if (password.length < 6) { showErr('Password must be at least 6 characters'); return; }

  const btn = document.getElementById('regBtn');
  btn.classList.add('loading'); btn.innerHTML = '⏳ Creating...';

  const payload = {
    name, email, password,
    role: currentRole,
    phone: document.getElementById('phone').value,
    city: document.getElementById('city').value,
    blood_group: currentRole === 'donor' ? document.getElementById('blood_group').value : null,
    dob: currentRole === 'donor' ? document.getElementById('dob').value : null,
    gender: currentRole === 'donor' ? document.getElementById('gender').value : null,
    weight: currentRole === 'donor' ? document.getElementById('weight').value : null,
    address: currentRole === 'donor' ? document.getElementById('address').value : null,
    emergency_contact_name: currentRole === 'donor' ? document.getElementById('ec_name').value : null,
    emergency_contact_phone: currentRole === 'donor' ? document.getElementById('ec_phone').value : null
  };

  try {
    const res = await fetch('/signup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.success) {
      suc.textContent = '✅ Account created! Redirecting to login...';
      suc.classList.add('show');
      setTimeout(() => window.location.href = '/login', 1500);
    } else {
      showErr(data.message || 'Registration failed');
      btn.classList.remove('loading'); btn.innerHTML = '<span>✅</span> Create Account';
    }
  } catch(e) {
    showErr('Network error. Please try again.');
    btn.classList.remove('loading'); btn.innerHTML = '<span>✅</span> Create Account';
  }
}
function showErr(msg) {
  const err = document.getElementById('errorMsg');
  err.textContent = msg; err.classList.add('show');
}
</script>
</body>
</html>
